<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Ulang Tahun Cinta!</title>
  <style>
    /* Pengaturan dasar */
    body {
      margin: 0;
      background: linear-gradient(to top, #fff0f5, #ffffff);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      text-align: center;
      font-size: 2.8em;
      color: #e91e63;
      margin-top: 60px;
    }

    .foto {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 230px;
      padding: 10px;
      border: 6px solid #ffb6c1;
      border-radius: 25px;
      background: #fff5fa;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
      text-align: center;
    }

    .foto img {
      width: 200px;
      border-radius: 20px;
    }

    .ucapan-bawah {
      position: absolute;
      top: calc(50% + 190px); /* Memberikan jarak tambahan antara foto dan teks */
      width: 100%;
      text-align: center;
      font-size: 1.2em;
      color: #ff69b4;
      text-shadow: 1px 1px white;
      padding: 0 20px;
      line-height: 1.6em;
    }

    /* Modal Style */
    .modal {
      display: none; /* Hidden by default */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); /* Black background with opacity */
      z-index: 1; /* Sit on top of everything else */
      padding-top: 100px;
      text-align: center;
    }

    .modal-content {
      background-color: #fefefe;
      margin: auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 400px;
      border-radius: 15px;
    }

    .modal button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 1.1em;
      cursor: pointer;
    }

    /* Animasi balon dan hati */
    .balloon {
      position: absolute;
      bottom: -80px;
      width: 40px;
      height: 60px;
      background-color: red;
      border-radius: 50% 50% 45% 45%;
      animation: float 8s linear infinite;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      width: 2px;
      height: 20px;
      background: #555;
      transform: translateX(-50%);
    }

    .heart {
      position: absolute;
      font-size: 2em;
      color: pink;
      animation: floatHeart 6s ease-in infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }

    @keyframes floatHeart {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
    }

    /* Media Query untuk tampilan desktop/laptop */
    @media (min-width: 768px) {
      h1 {
        font-size: 3em;
      }

      .foto {
        width: 300px;
      }

      .foto img {
        width: 250px;
      }
    }

    /* Media Query untuk tampilan ponsel */
    @media (max-width: 767px) {
      h1 {
        font-size: 2em;
      }

      .foto {
        width: 200px;
      }

      .foto img {
        width: 180px;
      }

      .ucapan-bawah {
        font-size: 1em;
      }

      iframe {
        width: 100%;
        height: 200px;
      }
    }

    /* Move SoundCloud player further down to make it less visible */
    #soundcloudPlayer {
      position: fixed;
      bottom: -100px; /* Move player further down */
      left: 0;
      width: 200px; /* Reduced size */
      height: 40px; /* Small player height */
      background-color: pink; /* Hidden behind a pink background */
      z-index: -1; /* Keep behind other content */
      border-radius: 10px;
    }

  </style>
</head>
<body>

  <!-- Modal for Music Background -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <p>Are you sure to play music in background?</p>
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <!-- First Slide Content -->
  <div id="firstSlide">
    <!-- First Slide content can be added here if needed -->
  </div>

  <!-- Second Slide Content (hidden initially) -->
  <div id="secondSlide" style="display: none;">
    <h1>Happyy Birthdayy Sayangkuu Cintakuu 🎂💕</h1>
    <div class="foto">
      <img src="https://i.imgur.com/Nbl8kGj.jpeg" alt="Foto Pacar">
    </div>
    <div class="ucapan-bawah">
      <p>Dunia aku jadi lebih indah tau karena kamu lahir &lt;3</p>
      <p>Semoga hidupmu semanis tawa kamu, secerah senyummu, dan sehangat pelukku hehehe 💞</p>
    </div>
  </div>

  <!-- SoundCloud Happy Birthday Dance music (without autoplay) -->
  <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay" id="soundcloudPlayer" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1628352795&color=%23ff5500&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=true&visual=false"></iframe>

  <!-- JavaScript to handle modal and transition -->
  <script>
    // Show modal on load
    window.onload = function() {
      document.getElementById("myModal").style.display = "block";
    };

    // Handle "Yes" button click
    document.getElementById("yesBtn").onclick = function() {
      document.getElementById("myModal").style.display = "none";  // Close modal
      // Start playing the Happy Birthday Dance music from SoundCloud
      document.getElementById("soundcloudPlayer").style.display = "block";  // Start playing the hidden player
      document.getElementById("soundcloudPlayer").src += "&auto_play=true";  // Add autoplay to the iframe URL
      document.getElementById("firstSlide").style.display = "none";
      document.getElementById("secondSlide").style.display = "block"; // Show second slide

      // Animating balloons and hearts (moved here so it happens after "Yes")
      for (let i = 0; i < 30; i++) {
        let b = document.createElement('div');
        b.className = 'balloon';
        b.style.left = `${Math.random() * 100}vw`;
        b.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 70%)`;
        b.style.animationDuration = `${6 + Math.random() * 4}s`;
        document.body.appendChild(b);
      }

      for (let i = 0; i < 20; i++) {
        let h = document.createElement('div');
        h.className = 'heart';
        h.innerHTML = '💖';
        h.style.left = `${Math.random() * 100}vw`;
        h.style.top = `${100 + Math.random() * 500}px`;
        h.style.animationDuration = `${5 + Math.random() * 3}s`;
        document.body.appendChild(h);
      }
    };

    // Handle "No" button click - Keep modal open and prompt again
    document.getElementById("noBtn").onclick = function() {
      document.getElementById("myModal").style.display = "block";  // Keep modal open
    };
  </script>

</body>
</html>
